name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app alembic tests
      - name: Run tests (SQLite)
        run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chamacore
          POSTGRES_PASSWORD: chamacore
          POSTGRES_DB: chamacore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAMACORE_DEBUG: "true"
      DATABASE_URL: "postgresql+psycopg://chamacore:chamacore@localhost:5432/chamacore_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Alembic migration
        run: alembic upgrade head
      - name: Run tests (PostgreSQL)
        run: pytest -q -m "not concurrency"

  concurrency-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chamacore
          POSTGRES_PASSWORD: chamacore
          POSTGRES_DB: chamacore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chamacore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHAMACORE_DEBUG: "true"
      DATABASE_URL: "postgresql+psycopg://chamacore:chamacore@localhost:5432/chamacore_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Alembic migration
        run: alembic upgrade head
      - name: Run concurrency tests (PostgreSQL)
        run: pytest -q -m "concurrency"