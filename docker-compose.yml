services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chamacore
      POSTGRES_PASSWORD: chamacore
      POSTGRES_DB: chamacore_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamacore"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    environment:
      # Develop against the compose PostgreSQL. Production deployments MUST
      # override the CHAMACORE_* variables (see docs/12_PRODUCTION_RUNBOOK.md).
      CHAMACORE_DATABASE_URL: postgresql+psycopg://chamacore:chamacore@postgres:5432/chamacore_test
      CHAMACORE_DEBUG: "true"
      CHAMACORE_PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
