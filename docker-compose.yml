services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chamacore
      POSTGRES_PASSWORD: chamacore
      POSTGRES_DB: chamacore_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamacore"]
      interval: 5s
      timeout: 5s
      retries: 5
